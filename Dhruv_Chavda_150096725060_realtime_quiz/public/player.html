<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🎮 Player Gamepad - QuizArena</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="player-body">
  <!-- Top Mini Bar -->
  <header class="player-header">
    <div class="player-info-left">
      <span class="player-name-tag" id="player-handle-display">Player</span>
    </div>
    <div class="player-score-tag">
      Score: <strong id="player-score-val">0</strong>
    </div>
  </header>

  <main class="player-main-container">
    <!-- State 1: Join Lobby Form -->
    <section class="player-view" id="player-view-join">
      <div class="join-card">
        <div class="game-logo">⚡ QuizArena</div>
        <form id="form-player-join">
          <div class="form-group">
            <label>Game PIN</label>
            <input type="text" id="input-pin" placeholder="e.g. 8421" maxlength="6" required autofocus>
          </div>
          <div class="form-group">
            <label>Your Nickname</label>
            <input type="text" id="input-player-name" placeholder="e.g. Karan" required>
          </div>
          <button type="submit" class="btn btn-player btn-large">ENTER LOBBY</button>
        </form>
      </div>
    </section>

    <!-- State 2: Waiting in Lobby -->
    <section class="player-view hidden" id="player-view-lobby">
      <div class="waiting-card">
        <div class="pulse-loader">🎮</div>
        <h2>You are in!</h2>
        <p>See your name on the host screen?</p>
        <span class="waiting-sub">Waiting for host to start the game...</span>
      </div>
    </section>

    <!-- State 3: Live 4-Color Answer Gamepad -->
    <section class="player-view hidden" id="player-view-gamepad">
      <div class="gamepad-top">
        <span class="player-q-counter" id="player-q-num">Q 1</span>
        <div class="player-timer" id="player-timer-val">15</div>
      </div>

      <div class="player-buttons-grid">
        <button class="gamepad-btn btn-red" data-option="0" id="btn-opt-0">
          <span class="btn-shape">🔺</span>
          <span class="btn-text" id="btn-text-0">Option A</span>
        </button>
        <button class="gamepad-btn btn-blue" data-option="1" id="btn-opt-1">
          <span class="btn-shape">🔷</span>
          <span class="btn-text" id="btn-text-1">Option B</span>
        </button>
        <button class="gamepad-btn btn-yellow" data-option="2" id="btn-opt-2">
          <span class="btn-shape">🟡</span>
          <span class="btn-text" id="btn-text-2">Option C</span>
        </button>
        <button class="gamepad-btn btn-green" data-option="3" id="btn-opt-3">
          <span class="btn-shape">🟩</span>
          <span class="btn-text" id="btn-text-3">Option D</span>
        </button>
      </div>
    </section>

    <!-- State 4: Answer Submitted / Waiting for round end -->
    <section class="player-view hidden" id="player-view-submitted">
      <div class="submitted-card">
        <div class="check-icon">⏳</div>
        <h2>Answer Locked In!</h2>
        <p>Holding for other competitors and timer countdown...</p>
      </div>
    </section>

    <!-- State 5: Round Result Feedback -->
    <section class="player-view hidden" id="player-view-result">
      <div class="result-card" id="result-feedback-card">
        <div class="result-icon" id="result-icon">🎉</div>
        <h2 id="result-title">Correct!</h2>
        <div class="points-tag" id="result-points">+850 Points</div>
        <span class="streak-text" id="result-total">Total: 850 pts</span>
      </div>
    </section>

    <!-- State 6: Game Finished -->
    <section class="player-view hidden" id="player-view-end">
      <div class="gameover-card">
        <div class="medal-icon">🏅</div>
        <h2>Game Completed!</h2>
        <div class="final-score-pill" id="player-final-score">Final Score: 4,200</div>
        <a href="player.html" class="btn btn-player">Play Another Game</a>
      </div>
    </section>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
  <script>
    initPlayerApp();
  </script>
</body>
</html>
